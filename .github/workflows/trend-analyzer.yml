name: YouTube Trend Analyzer

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiohttp-socks

      - name: Create environment file
        run: |
          cat > .env <<'EOF'
          APP_NAME=YouTube Trend Analyzer
          RUN_MODE=once
          POLL_INTERVAL_MINUTES=60
          LOG_LEVEL=INFO

          HTTP_PROXY=

          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

          LLM_PROVIDER=gemini
          GEMINI_API_KEYS=["${{ secrets.ACTIVE_LLM_API_KEY }}"]
          GEMINI_MODEL=gemini-2.5-flash
          GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai

          LLM_TEMPERATURE=0.3
          LLM_MAX_TOKENS=2048
          LLM_REQUEST_TIMEOUT=90

          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PARSE_MODE=HTML
          TELEGRAM_DISABLE_WEB_PREVIEW=true

          TARGET_TOPICS=["تراپی نوستالژیک","موسیقی جاز","موسیقی مفهومی","موسیقی تلفیقی"]
          TARGET_CHANNEL_IDS=[]

          YOUTUBE_RSS_TIMEOUT=30
          YOUTUBE_API_TIMEOUT=15
          YOUTUBE_MAX_RESULTS=50
          YOUTUBE_MAX_COMMENTS=20
          VIDEO_AGE_DAYS_MAX=2
          TOP_N_VIDEOS=5
          EOF

      - name: Clear proxy environment
        run: |
          unset HTTP_PROXY
          unset HTTPS_PROXY
          unset ALL_PROXY
          unset http_proxy
          unset https_proxy
          unset all_proxy

      - name: Run analyzer
        run: |
          env -u HTTP_PROXY \
              -u HTTPS_PROXY \
              -u ALL_PROXY \
              -u http_proxy \
              -u https_proxy \
              -u all_proxy \
              python main.py --mode once
